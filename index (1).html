<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미소앤봄 · 시술 후 주의사항 | MeSO×nBOM Aftercare</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#CFE7E1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#FFFFFF; --band:#CFE7E1; --ink:#2C3A42; --ink2:#3E4C53; --muted:#66747A;
  --line:#E2EBE9; --line2:#E8F1EE; --primary:#2E5E55; --primary-dk:#1F4A42;
  --soft:#DDEFEA; --soft-bd:#B9DDD4; --on:#D6EEE8; --on-bd:#8CC9BC;
  --alert:#B42318; --alert-soft:#FEF3F2; --alert-bd:#F7D4D0;
  --shadow:0 4px 14px rgba(46,94,85,.06);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Noto Sans KR',system-ui,-apple-system,sans-serif;
}
html[lang="zh-Hans"]{--sans:'Noto Sans SC','Noto Sans KR',system-ui,sans-serif}
html[lang="zh-Hant"]{--sans:'Noto Sans TC','Noto Sans KR',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 40px}

/* header (문진표와 같은 민트 밴드) */
.top{background:var(--band);border-radius:0 0 28px 28px}
.top-in{max-width:560px;margin:0 auto;padding:16px 20px 18px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand img{display:block;height:32px;width:auto}
.brand .kr{font-size:13px;letter-spacing:4px;color:var(--primary-dk);font-weight:600}
.langs{display:flex;gap:6px;margin-top:14px}
.lang{flex:1 1 0;min-height:40px;padding:0 4px;border-radius:999px;border:1.5px solid var(--line);background:#FFFFFF;font-size:13px;font-weight:500;color:var(--ink2);text-align:center;white-space:nowrap}
.lang.on{background:var(--on);border-color:var(--on-bd);color:var(--primary-dk);font-weight:700}

/* home */
.hero{padding:26px 0 4px}
.hero h1{font-size:26px;font-weight:700;letter-spacing:-.5px}
.hero p{color:var(--muted);margin-top:4px;font-size:15px}
.cat{margin-top:22px}
.cat h2{font-size:13px;letter-spacing:1px;color:var(--muted);font-weight:500;margin-bottom:10px}
.proc{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;text-align:left;background:#FFFFFF;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px;box-shadow:var(--shadow);transition:border-color .15s,background .15s}
.proc:hover,.proc:active{border-color:var(--on-bd);background:var(--on)}
.proc .ic{flex:0 0 38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--primary)}
.proc .nm{flex:1;min-width:0}
.proc .nm b{display:block;font-weight:600;font-size:16px;line-height:1.4}
.proc .nm small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.proc .ar{color:var(--primary);flex:0 0 auto}
.tip{margin-top:18px;font-size:13.5px;color:var(--primary-dk);background:var(--soft);border:1px solid var(--soft-bd);border-radius:16px;padding:14px 16px;line-height:1.55}

/* detail */
.back{display:inline-flex;align-items:center;gap:4px;margin:18px 0 2px;min-height:44px;padding:0 14px 0 8px;border:1px solid var(--line);border-radius:999px;background:#FFFFFF;color:var(--ink2);font-size:14px;font-weight:500}
.dt{padding:14px 0 2px}
.dt h1{font-size:24px;font-weight:700;line-height:1.35;letter-spacing:-.3px}
.dt small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.multi-nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0;align-items:center}
.multi-nav span{font-size:13px;color:var(--muted)}
.multi-nav button{min-height:36px;font-size:13px;font-weight:500;padding:0 14px;border-radius:999px;background:var(--on);border:1.5px solid var(--on-bd);color:var(--primary-dk)}
.sec{background:#FFFFFF;border:1.5px solid var(--line);border-radius:20px;padding:16px 18px 12px;margin-top:14px;box-shadow:var(--shadow)}
.sec h3{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin-bottom:6px;color:var(--primary)}
.sec ul{list-style:none}
.sec li{position:relative;padding:8px 0 8px 18px;border-top:1px solid var(--line2);font-size:15.5px}
.sec li:first-child{border-top:0}
.sec li::before{content:"";position:absolute;left:2px;top:18px;width:7px;height:7px;border-radius:50%;background:var(--on-bd)}
.sec.thread{background:var(--soft);border-color:var(--soft-bd);box-shadow:none}
.sec.thread h3{color:var(--primary-dk)}
.sec.thread li{border-top-color:var(--soft-bd)}
.sec.thread li::before{background:var(--primary)}
.sec.call{background:var(--alert-soft);border-color:var(--alert-bd);box-shadow:none}
.sec.call h3{color:var(--alert)}
.sec.call li::before{background:var(--alert)}
.sec.call li{border-top-color:var(--alert-bd)}
.proc-block + .proc-block{margin-top:34px;padding-top:22px;border-top:2px solid var(--line)}

/* contact */
.contact{margin-top:28px;background:var(--band);border-radius:24px;padding:20px 18px}
.contact h4{font-size:17px;font-weight:700;color:var(--primary-dk)}
.callbtn{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0 14px;min-height:56px;background:var(--primary);color:#fff;text-decoration:none;border-radius:16px;padding:10px 14px;font-size:16px;font-weight:600;text-align:center}
.info{font-size:14px;color:var(--ink2);background:#FFFFFF;border-radius:16px;padding:4px 16px 14px}
.info b{color:var(--ink);font-weight:600;display:block;margin-top:10px}
.disc{font-size:12.5px;color:var(--muted);margin-top:18px;line-height:1.6}
.foot{text-align:center;font-family:var(--serif);color:var(--primary);font-size:16px;margin-top:22px;letter-spacing:.04em}


.pending{margin:12px 0 0;font-size:13px;color:var(--primary-dk);background:var(--soft);border:1px solid var(--soft-bd);border-radius:12px;padding:10px 14px}
.sec.info{background:#FFFFFF}
.sec.area details{border-top:1px solid var(--line2);padding:2px 0}
.sec.area details:first-of-type{border-top:0}
.sec.area summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:44px;font-weight:600;font-size:15.5px;color:var(--ink)}
.sec.area summary::-webkit-details-marker{display:none}
.sec.area summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--primary);border-bottom:2px solid var(--primary);transform:rotate(45deg);margin-right:6px;transition:transform .15s}
.sec.area details[open] summary::after{transform:rotate(-135deg)}
.sec.area details ul{padding-bottom:6px}
.sheet.cards{min-height:auto}
.card small:first-child{margin-top:0;color:var(--primary);font-weight:600}


/* 직원용 문자 보내기 */
.send h1{font-size:24px;font-weight:700;letter-spacing:-.3px}
.send .lead{color:var(--muted);font-size:14.5px;margin-top:4px}
.send .step{margin-top:22px}
.send .step > b{display:block;font-size:14px;font-weight:700;color:var(--primary);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:500;color:var(--ink2)}
.chip.on{background:var(--on);border-color:var(--on-bd);color:var(--primary-dk);font-weight:700}
.send .catlbl{font-size:12.5px;color:var(--muted);margin:12px 0 6px}
.send textarea{width:100%;min-height:150px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:15px;color:var(--ink);resize:vertical;line-height:1.55}
.send textarea:focus{outline:2px solid var(--primary);outline-offset:1px}
.send .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.send .btn{min-height:50px;border-radius:14px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center;padding:0 10px}
.send .btn.pri{grid-column:1/-1;background:var(--primary);color:#fff}
.send .btn.sec2{background:#fff;border:1.5px solid var(--line);color:var(--ink2)}
.send .btn[aria-disabled="true"]{background:var(--line);color:var(--muted);pointer-events:none}
.send .count{font-size:13px;color:var(--muted);margin-top:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--primary-dk);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}


.msgr{background:#FFFFFF;border-radius:16px;padding:10px 16px 6px;margin-bottom:12px}
.msgr p{font-size:13.5px;font-weight:600;color:var(--primary-dk);margin-bottom:4px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}
.mrow:first-of-type{border-top:0}
.mtxt{min-width:0}
.mtxt b{display:block;font-size:14.5px;font-weight:600;color:var(--ink)}
.mtxt span{display:block;font-size:14px;color:var(--ink2);word-break:break-all}
.mtxt small{display:block;font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:2px}
.mact{display:flex;gap:6px;flex:0 0 auto}
.mbtn{min-height:38px;padding:0 12px;border-radius:999px;border:1.5px solid var(--on-bd);background:var(--on);color:var(--primary-dk);font-size:13px;font-weight:600;display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap}

.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--on);border-top-color:var(--primary);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* QR print sheet */
.qrbar{max-width:800px;margin:16px auto;padding:0 16px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.qrbar button{background:var(--primary);color:#fff;border-radius:12px;min-height:44px;padding:0 18px;font-weight:600}
.qrbar p{font-size:14px;color:var(--muted);flex:1;min-width:220px}
.sheet{width:210mm;min-height:297mm;margin:0 auto 20px;background:#fff;box-shadow:0 2px 16px rgba(0,0,0,.08);padding:16mm 14mm;page-break-after:always}
.stand{display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;gap:9mm;min-height:265mm}
.stand .logo{width:110mm;height:auto;display:block}
.stand .kr{font-size:18px;letter-spacing:6px;color:var(--primary-dk);font-weight:600;margin-top:-5mm}
.stand .t-ko{font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1.2}
.stand .t-en{font-family:var(--serif);font-size:26px;font-weight:500;color:var(--primary)}
.stand .qrbox{padding:7mm;border:1.5px solid var(--on-bd);border-radius:8mm;background:#fff}
.stand .scan{width:100%;max-width:150mm;border:1px solid var(--line);border-radius:6mm;padding:2mm 7mm}
.stand .scan div{padding:2.4mm 0;border-bottom:1px solid var(--line2);font-size:16px}
.stand .scan div:last-child{border-bottom:0}
.stand .scan div:first-child{font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
.grid h2{grid-column:1/-1;font-size:15px;color:var(--muted);font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:6mm}
.grid h2 img{height:8mm;width:auto}
.card{border:1.5px solid var(--line);border-radius:5mm;padding:5mm;display:flex;gap:5mm;align-items:center;break-inside:avoid}
.card .q{flex:0 0 auto}
.card b{display:block;font-size:16px;line-height:1.35}
.card small{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.4}
.card .mini{font-family:var(--serif);font-style:italic;color:var(--primary);font-size:13px;margin-top:6px}
.links{max-width:800px;margin:0 auto 30px;padding:0 16px;font-size:13px;color:var(--muted)}
.links table{width:100%;border-collapse:collapse;background:#fff}
.links td{border:1px solid var(--line);padding:6px 8px;word-break:break-all}
@media print{
  body{background:#fff}
  .qrbar,.links{display:none}
  .sheet{box-shadow:none;margin:0;width:auto;min-height:auto}
  .stand{min-height:260mm}
  @page{size:A4;margin:0}
}
</style>
</head>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

    document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch(e) { toast(text); } t.remove(); };

}

  if (!sendState.ids.length) return '';
  const sep = APP_URL.indexOf('?') >= 0 ? '&' : '?';
  return APP_URL + sep + 'p=' + sendState.ids.join(',') + (sendState.lang !== 'ko' ? '&lang=' + sendState.lang : '');
}
function sendMsg(){ const l = sendLink(); return l ? SMS[sendState.lang].replace('{link}', l) : ''; }
function renderSend(){
  document.documentElement.lang = 'ko';
  document.title = '미소앤봄 · 주의사항 문자 보내기';
  let h = '<header class="top"><div class="top-in"><div class="brand"><img src="'+LOGO+'" alt="MeSO×nBOM"><span class="kr">직원용</span></div></div></header>'
    + '<main class="wrap send"><section class="hero"><h1>주의사항 문자 보내기</h1><p class="lead">시술을 고르면 환자에게 보낼 문자와 링크가 자동으로 만들어져요.</p></section>';
  h += '<div class="step"><b>1. 환자 언어</b><div class="chips">'
    + LANGS.map(([c,l]) => '<button class="chip'+(c===sendState.lang?' on':'')+'" data-slang="'+c+'" aria-pressed="'+(c===sendState.lang)+'">'+l+'</button>').join('')
    + '</div></div>';
  h += '<div class="step"><b>2. 받은 시술 (여러 개 선택 가능)</b>';
  CONTENT.cats.forEach(c => {
    const list = CONTENT.procs.filter(p => p.cat === c.id);
    if (!list.length) return;
    h += '<div class="catlbl">'+esc(c.name.ko)+'</div><div class="chips">'
      + list.map(p => { const on = sendState.ids.indexOf(p.id) >= 0;
          return '<button class="chip'+(on?' on':'')+'" data-sproc="'+esc(p.id)+'" aria-pressed="'+on+'">'+esc(p.name.ko)+'</button>'; }).join('')
      + '</div>';
  });
  h += '<p class="count" id="scount"></p></div>';
  h += '<div class="step"><b>3. 보낼 문자 (필요하면 고쳐서 보내세요)</b><textarea id="smsg" placeholder="위에서 시술을 먼저 골라주세요"></textarea>'
    + '<div class="btns"><a class="btn pri" id="ssms" href="#">문자 앱으로 보내기</a>'
    + '<button class="btn sec2" id="scopy">문자 내용 복사</button><button class="btn sec2" id="slink">링크만 복사</button>'
    + '<a class="btn sec2" id="sprev" target="_blank" rel="noopener" href="#" style="grid-column:1/-1">환자 화면 미리보기</a></div></div>'
    + '<p class="disc">휴대폰에서 열면 \'문자 앱으로 보내기\'를 눌렀을 때 문자 앱이 열리고 내용이 채워져요. 받는 사람 번호만 입력하면 됩니다. PC에서는 \'문자 내용 복사\' 후 병원 문자 프로그램이나 카카오톡에 붙여넣으세요.</p>'
    + '</main><div class="toast" id="toast"></div>';
  document.getElementById('app').innerHTML = h;
  updateSend(true);
}
function updateSend(resetText){
  const ta = document.getElementById('smsg');
  if (resetText || !sendState.edited) { ta.value = sendMsg(); sendState.edited = false; }
  const link = sendLink(), off = !link;
  const sms = document.getElementById('ssms'), prev = document.getElementById('sprev');
  sms.setAttribute('aria-disabled', off); prev.setAttribute('aria-disabled', off);
  sms.href = off ? '#' : 'sms:?&body=' + encodeURIComponent(ta.value);
  prev.href = off ? '#' : link;
  const n = sendState.ids.length;
  document.getElementById('scount').textContent = n ? '선택한 시술 ' + n + '개: ' + sendState.ids.map(id => byId(id).name.ko).join(', ') : '';
}
function bindSend(){
  document.addEventListener('click', e => {
    const l = e.target.closest('[data-slang]'), p = e.target.closest('[data-sproc]');
    if (l) { sendState.lang = l.dataset.slang; document.querySelectorAll('[data-slang]').forEach(b => { const on = b === l; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); updateSend(true); }
    if (p) { const id = p.dataset.sproc, i = sendState.ids.indexOf(id);
      if (i >= 0) sendState.ids.splice(i, 1); else sendState.ids.push(id);
      p.classList.toggle('on', i < 0); p.setAttribute('aria-pressed', i < 0); updateSend(true); }
    if (e.target.closest('#scopy')) { const v = document.getElementById('smsg').value; if (v) copyText(v); }
    if (e.target.closest('#slink')) { const v = sendLink(); if (v) copyText(v); }
  });
  document.addEventListener('input', e => { if (e.target.id === 'smsg') { sendState.edited = true; updateSend(false); } });
}

/* ---------- 시작: 구글 시트에서 문구 불러오기 ---------- */
const CACHE_KEY = 'mesonbom-aftercare-content';
let started = false;
function valid(d){ return d && Array.isArray(d.procs) && d.procs.length && Array.isArray(d.cats); }
function fetchJson(url, ms){
  return Promise.race([
    fetch(url, {cache: 'no-store'}).then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); }),
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))
  ]).then(d => { if (!valid(d)) throw new Error('bad data'); return d; });
}
function paint(){
  if (PARAMS.page === 'qr') renderQR();
  else if (PARAMS.page === 'send') renderSend();
  else render(false);
}
function start(d){
  CONTENT = d;
  if (!started) {
    started = true;
    if (PARAMS.page === 'send') bindSend();
    if (!PARAMS.page && PARAMS.p && !location.hash) history.replaceState(null, '', location.pathname + location.search + '#' + PARAMS.p);
    paint();
    if (!PARAMS.page) window.scrollTo(0, 0);
  } else if (PARAMS.page !== 'send') {
    paint();
  }
}
function loading(){
  document.getElementById('app').innerHTML = '<div style="min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px">'
    + '<img src="'+LOGO+'" alt="MeSO×nBOM" style="height:36px;width:auto">'
    + '<div class="spin"></div></div>';
}
(function boot(){
  const url = String(window.AFTERCARE_DATA_URL || '');
  const live = /^https:\/\/script\.google(usercontent)?\.com\//.test(url)
    ? fetchJson(url + (url.indexOf('?') < 0 ? '?' : '&') + 'format=json', 12000)
    : Promise.reject(new Error('no data url'));
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch(e) {}
  const save = d => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch(e) {} return d; };
  if (valid(cached)) {
    start(cached);
    live.then(d => { save(d); if (JSON.stringify(d) !== JSON.stringify(cached)) start(d); }).catch(() => {});
    return;
  }
  loading();
  live.then(save)
    .catch(() => fetchJson('content.json', 8000))
    .then(start)
    .catch(() => {
      document.getElementById('app').innerHTML = '<div class="wrap" style="padding-top:60px;text-align:center"><p>화면을 불러오지 못했어요. 잠시 후 다시 열어주세요.</p><p style="margin-top:8px;color:var(--muted)">Please try again in a moment. · 02-6952-0147</p></div>';
    });
})();
</script>
